spring:
  application:
    name: lobster-trade-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lobster_trade?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:lobster-trade-jwt-secret-key-2024-dev-only}
  expire: ${JWT_EXPIRE:86400000}

aliyun:
  sms:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:龙虾道具交易平台}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    endpoint: dysmsapi.aliyuncs.com

server:
  port: 8080

logging:
  level:
    com.lobster.trade: debug