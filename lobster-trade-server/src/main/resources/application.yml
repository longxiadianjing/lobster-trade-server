# ================================================
# 龙虾道具交易平台 - application.yml
# 【生产环境】所有敏感字段必须通过环境变量注入
# 禁止在生产环境使用硬编码默认值
# ================================================

spring:
  application:
    name: lobster-trade-server

  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 【安全】数据库密码通过环境变量注入，禁止硬编码
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lobster_trade}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lobster.trade.model.entity

# 【安全】JWT密钥必须通过环境变量注入，禁止硬编码
jwt:
  secret: ${JWT_SECRET:}
  expire: ${JWT_EXPIRE:86400000}

# ================================================
# 支付渠道统一配置
# 所有敏感信息通过环境变量注入，禁止硬编码
# ================================================
payment:
  # 【安全】支付商户密钥（所有支付通用）
  secret: ${PAYMENT_SECRET:}

  # ---------- 支付宝配置 ----------
  alipay:
    # 【安全】enabled 必须通过环境变量注入（生产：ALIPAY_ENABLED=true）
    enabled: ${ALIPAY_ENABLED:false}
    # 【安全】AppID 必须通过环境变量注入
    appId: ${ALIPAY_APP_ID:}
    # 【安全】应用私钥（RSA2 PKCS8）必须通过环境变量注入
    privateKey: ${ALIPAY_PRIVATE_KEY:}
    # 【安全】支付宝公钥必须通过环境变量注入
    alipayPublicKey: ${ALIPAY_PUBLIC_KEY:}
    # 异步回调地址
    notifyUrl: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/payment/alipay/notify}
    # 前端回跳地址
    returnUrl: ${ALIPAY_RETURN_URL:http://localhost:5174/payment/result}
    # 是否沙箱（测试环境）
    sandbox: ${ALIPAY_SANDBOX:false}

  # ---------- 微信支付配置 ----------
  wechat:
    # 【安全】enabled 必须通过环境变量注入
    enabled: ${WECHAT_ENABLED:false}
    # 【安全】AppID 必须通过环境变量注入
    appId: ${WECHAT_APP_ID:}
    # 【安全】商户号必须通过环境变量注入
    mchId: ${WECHAT_MCH_ID:}
    # 【安全】APIv3 私钥内容（直填内容，不依赖文件）
    privateKey: ${WECHAT_PRIVATE_KEY:}
    # 私钥文件路径（可选，优先用 privateKey 环境变量）
    privateKeyPath: ${WECHAT_PRIVATE_KEY_PATH:}
    # APIv2 密钥（HMAC-SHA256，可选）
    apiKey: ${WECHAT_API_KEY:}
    # 【安全】平台证书序列号必须通过环境变量注入
    certSerialNo: ${WECHAT_CERT_SERIAL_NO:}
    # 平台证书内容（APIv3 回调验签用）
    certContent: ${WECHAT_CERT_CONTENT:}
    # 异步回调地址
    notifyUrl: ${WECHAT_NOTIFY_URL:http://localhost:8080/api/payment/wechat/notify}

  # ---------- 银行卡/聚合支付配置 ----------
  bankcard:
    # 【安全】银行卡支付未启用，预留
    enabled: ${BANKCARD_ENABLED:false}
    # 支付平台名称（laKaLa/EasyPay/unionPay）
    platform: ${BANKCARD_PLATFORM:}
    mchId: ${BANKCARD_MCH_ID:}
    appId: ${BANKCARD_APP_ID:}
    # 【安全】私钥/公钥通过环境变量注入
    privateKey: ${BANKCARD_PRIVATE_KEY:}
    publicKey: ${BANKCARD_PUBLIC_KEY:}
    notifyUrl: ${BANKCARD_NOTIFY_URL:}

server:
  port: ${SERVER_PORT:8080}

upload:
  path: ${UPLOAD_PATH:D:/uploads/lobster}
  base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}

logging:
  level:
    com.lobster.trade: ${LOG_LEVEL:debug}
