spring:
  application:
    name: lobster-trade-server

  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lobster_trade?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root

  redis:
    host: localhost
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lobster.trade.model.entity

jwt:
  secret: ${JWT_SECRET}
  expire: ${JWT_EXPIRE:86400000}

payment:
  secret: ${PAYMENT_SECRET:mock-payment-secret-key-2026}
  alipay:
    appId: ${ALIPAY_APP_ID:2021006151687443}
    privateKey: ${ALIPAY_PRIVATE_KEY:}
    alipayPublicKey: ${ALIPAY_PUBLIC_KEY:}
    notifyUrl: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/payment/alipay/notify}
    sandbox: ${ALIPAY_SANDBOX:false}
  wechat:
    appId: ${WECHAT_APP_ID:}
    mchId: ${WECHAT_MCH_ID:1715080856}
    apiKey: ${WECHAT_API_KEY:}
    certPath: ${WECHAT_CERT_PATH:}
    notifyUrl: ${WECHAT_NOTIFY_URL:http://localhost:8080/api/payment/wechat/notify}
    enabled: ${WECHAT_ENABLED:false}

server:
  port: 8080

upload:
  path: D:/uploads/lobster
  base-url: http://localhost:8080/uploads

logging:
  level:
    com.lobster.trade: debug
